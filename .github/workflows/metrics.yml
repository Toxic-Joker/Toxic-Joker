# Visit https://github.com/lowlighter/metrics for full reference
name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: ${{ secrets.METRICS_GIST }}

          # General
          user: Toxic-Joker
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris

          # plugin_activity / plugin_habits disabled: both crash with an
          # unfixed upstream bug (lowlighter/metrics#1834) whenever a
          # PushEvent has no commits array, so they always render as a red
          # "Unexpected error" box.

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          plugin_languages_categories: markup, programming
          
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4
          
          plugin_traffic: yes
          
          # WakaTime
          plugin_wakatime: yes
          plugin_wakatime_days: 30
          plugin_wakatime_limit: 5
          plugin_wakatime_user: Toxic_Joker
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
