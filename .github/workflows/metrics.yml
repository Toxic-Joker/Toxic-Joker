# Visit https://github.com/lowlighter/metrics for full reference
name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: ${{ secrets.METRICS_GIST }}

          # General
          user: Toxic-Joker
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris

          # plugin_activity / plugin_habits disabled: both crash with an
          # unfixed upstream bug (lowlighter/metrics#1834) whenever a
          # PushEvent has no commits array, so they always render as a red
          # "Unexpected error" box.

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          plugin_languages_categories: markup, programming
          
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4
          
          plugin_traffic: yes

          # Random code snippet, replacing WakaTime. Visibility stays
          # "public" so only public-repo code can ever be shown.
          plugin_code: yes
          plugin_code_lines: 12
          plugin_code_load: 1000
          plugin_code_days: 60
          plugin_code_visibility: public
          plugin_code_languages: python, javascript, html, dockerfile
